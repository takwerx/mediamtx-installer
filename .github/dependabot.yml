# Dependabot version updates (ops #241). Weekly, grouped into one PR per ecosystem,
# at most 3 open PRs. Major versions are ignored here on purpose: a major bump
# gets its own ops issue and a test instead of an automatic PR. Security
# updates are a separate repo setting and are not limited by this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    target-branch: dev
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # The console's pinned Python packages (ops #683). target-branch dev: without it Dependabot
  # branches from main and the PR drags old files along. The Python 3.9 pins (Rocky 9) must install
  # on 3.9, so releases that need Python 3.10 or newer are ignored here: urllib3 2.7 and up,
  # requests 2.33 and up. requirements.txt pins those newer releases by hand for Python 3.10 and
  # up (ops #1020). Bump them there when a new one is out.
  # tests/test_download_pins.py fails if a pin for Python 3.9 does not support Python 3.9.
  - package-ecosystem: "pip"
    directory: "/config-editor"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    target-branch: dev
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "urllib3"
        versions: [">=2.7.0"]
      - dependency-name: "requests"
        versions: [">=2.33.0"]
