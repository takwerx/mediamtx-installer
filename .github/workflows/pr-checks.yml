name: PR checks

# Automatic checks on every PR (ops #329, same shape as infra-TAK's PR checks). No Claude involved.
# Also run on every push to dev and main (ops #1160): two PRs that each pass alone can fail together once both
# are merged (v2.1.19: PR 66 and PR 67), and PR checks never see that. Same jobs, same checks-ok.
# A red check blocks the merge once `checks-ok` is made a required check. Run the same things locally:
#   bash .github/ci/static_checks.sh      (needs shellcheck and PyYAML)
#   python3 -m pytest tests -q            (needs flask ruamel.yaml requests psutil pytest; CI installs the console's own requirements*.txt plus .github/ci/requirements-testtools.lock by hash)
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]

concurrency:
  # PRs by number, pushes by branch (github.ref), so a push to dev never cancels a PR run and the
  # two never share a group. Only PR runs cancel an older run; a push run always finishes.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# GitHub-hosted runners only (public repo; fork PRs must never reach the self-hosted Studio runners).
# Pinned to ubuntu-24.04, not ubuntu-latest, so the checks mean the same thing every run.
jobs:
  # bash -n, shellcheck (errors fail, warnings are listed), JSON/YAML parse, Python compile.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      # shellcheck pinned so "error" means the same thing every run (the runner image's own moves).
      - run: pip install --require-hashes -r .github/ci/requirements-static.lock && shellcheck --version
      - run: bash .github/ci/static_checks.sh

  # Unit tests in tests/: console and Ku-band security (ops #618), email links not taken from the Host header (ops #622). Run locally with
  #   python3 -m pytest tests -q      (needs flask ruamel.yaml requests psutil pytest; CI installs the console's own requirements*.txt plus .github/ci/requirements-testtools.lock by hash)
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r config-editor/requirements.txt -r config-editor/requirements-psutil.txt -r .github/ci/requirements-testtools.lock
      - run: python3 -m pytest tests -q

  # Unit tests for the console's own logic (config-editor/tests). Share links must not open other streams.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r config-editor/requirements.txt -r config-editor/requirements-psutil.txt -r .github/ci/requirements-testtools.lock
      - run: python3 -W ignore -m unittest discover -s config-editor/tests -v

  # Version file vs newest tag, and the newest release's notes (ops #371). Needs the GitHub API.
  release-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: python3 -I .github/ci/release_hygiene.py --self-test
      - run: python3 -I .github/ci/release_hygiene.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Workflow files stay safe (ops #1014): every action pinned to a full commit SHA, read-only default token, the
  # security scans (not required yet) keep their shape. Run locally: python3 -I .github/ci/test_workflow_pins.py
  workflow-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 -I .github/ci/test_workflow_pins.py

  # One stable name to require in branch protection. A failed or cancelled job fails it.
  checks-ok:
    if: always()
    needs: [static, unit, tests, release-hygiene, workflow-pins]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::a required check failed"; exit 1 ;;
          esac
