# Dependabot version updates (ops #241). Weekly, grouped into one PR per ecosystem,
# at most 3 open PRs. Major versions are ignored here on purpose: a major bump
# gets its own ops issue and a test instead of an automatic PR. Security
# updates are a separate repo setting and are not limited by this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    target-branch: dev
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # The console's pinned Python packages (ops #683). target-branch dev: without it Dependabot
  # branches from main and the PR drags old files along. The pins must install on Python 3.10 and
  # newer (Ubuntu 22.04's Python; Rocky 9 builds the editor's venv from python3.12, ops #1030).
  # tests/test_download_pins.py fails if a pinned release does not support Python 3.10.
  - package-ecosystem: "pip"
    directory: "/config-editor"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    target-branch: dev
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
